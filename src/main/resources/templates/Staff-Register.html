<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Staff Register</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: #fff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 18px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #333;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-weight: bold;
            color: #444;
            margin-bottom: 5px;
            display: block;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            transition: border 0.3s;
        }

        input:focus {
            border: 1px solid #4a90e2;
            outline: none;
        }

        .error {
            color: red;
            font-size: 12px;
            font-style: italic;
            margin-top: -8px;
            margin-bottom: 8px;
        }

        .success {
            color: green;
            text-align: center;
            margin-top: 10px;
        }

        .fail {
            color: red;
            text-align: center;
            margin-top: 10px;
        }

        button {
            padding: 12px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #357ABD;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Staff Registration</h2>

        <form th:action="@{/staff/register}" th:object="${staff}" method="post">

            <div>
                <label>Staff Code</label>
                <input type="number" th:field="*{staffcode}" required/>
                <p th:if="${#fields.hasErrors('staffcode')}" th:errors="*{staffcode}" class="error"></p>
            </div>

            <div>
                <label>Staff Name</label>
                <input type="text" th:field="*{staffname}" required/>
                <p th:if="${#fields.hasErrors('staffname')}" th:errors="*{staffname}" class="error"></p>
            </div>

            <div>
                <label>Password</label>
                <input type="password" th:field="*{password}" required/>
                <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error"></p>
            </div>

            <div>
                <label>Department</label>
                <input type="text" th:field="*{department}" required/>
                <p th:if="${#fields.hasErrors('department')}" th:errors="*{department}" class="error"></p>
            </div>

            <button type="submit">📝 Register</button>

            <p th:if="${msg}" th:text="${msg}" class="success"></p>
            <p th:if="${staffcodeerror}" th:text="${staffcodeerror}" class="fail"></p>
        </form>
    </div>
</body>
</html>

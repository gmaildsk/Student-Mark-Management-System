<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Student</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: #fff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 18px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #333;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-weight: bold;
            margin-bottom: 5px;
            color: #444;
        }

        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            transition: border 0.3s;
        }

        input:focus {
            border: 1px solid #4a90e2;
            outline: none;
        }

        button {
            padding: 8px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
 
        button:hover {
            background: #357ABD;
        }
        .error {
    	color: red;
    	margin-top: 1rem;
	}
	 .success {
            color: green; margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Add Student and Marks</h2>

        <form th:action="@{/savestudent}" th:object="${smkey}" method="post">

            <div>
                <label>Register Number</label>
                <input type="number" th:field="*{rno}" required/>
                <p th:if="${rnoerror}" th:text="${rnoerror}" class="error"></p>
                <p th:if="${#fields.hasErrors('rno')}" th:errors="*{rno}" style="color:red;"></p>
            </div>

            <div>
                <label>Student Name</label>
                <input type="text" th:field="*{sname}" required/>
            </div>

            <div>
                <label>Mark 1</label>
                <input type="number" th:field="*{mark1}" required/>
                 <p th:if="${#fields.hasErrors('mark1')}" th:errors="*{mark1}" class="error"></p>
            </div>

            <div>
                <label>Mark 2</label>
                <input type="number" th:field="*{mark2}" required/>
                <p th:if="${#fields.hasErrors('mark2')}" th:errors="*{mark2}" class="error"></p>
            </div>



            <button type="submit">💾 Save Student</button>
            
			<button type="button" th:onclick="|window.location.href='@{/viewHomePage}'|"> 🔙 Go Back</button>
             
             <p th:if="${regnewmsg}" th:text="${regnewmsg}" class="success"></p>

             
        </form>
    </div>
</body>
</html>

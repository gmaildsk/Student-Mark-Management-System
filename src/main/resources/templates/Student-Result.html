<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Result</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: #fff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 18px rgba(0,0,0,0.1);
            text-align: center;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .error {
            color: red;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .details {
            text-align: left;
            margin-top: 20px;
        }

        .details p {
            font-size: 16px;
            margin: 10px 0;
            padding: 8px;
            background: #f9fafc;
            border-left: 4px solid #4a90e2;
            border-radius: 6px;
        }

        strong {
            color: #333;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            background: #4a90e2;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.3s;
        }

        a:hover {
            background: #357ABD;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Welcome, <span th:text="${heyman.sname}"></span> 🎓</h2>

        <p th:if="${error}" th:text="${error}" class="error"></p>

<!-- Basic Student info -->
        <div class="details" style="display: flex; gap: 20px; justify-content: center; flex-wrap: wrap;">
        <div style="background: #f9fafc; border-left: 4px solid #4a90e2; padding: 8px; border-radius:6px;">
        	<strong>Register No:</strong> <span th:text="${heyman.rno}"></span></div>
         <div style="background: #f9fafc; border-left: 4px solid #4a90e2; padding: 8px; border-radius:6px;">
            <strong>Name:</strong> <span th:text="${heyman.sname}"></span>></div>
            </div>
<!-- Mark Table -->
		<h3 style="margin-top: 20px;">📘 Subjects & Marks</h3>
         <table style="width:100%; border-collapse: collapse; margin-top:10px;">
         <thead>
         <tr style="background: #f0f0f0;">
         <th style ="border:1px solid #ccc; padding:8px;">Semester</th>
         <th style="border:1px solid #ccc; padding:8px;">Subject Code</th>
         <th style="border:1px solid #ccc; padding:8px;">Mark</th>
         </tr>
        </thead>
        <tbody>
        <tr th:each="sub:${heyman.subjects}">
        <td style= "border:1px solid #ccc; padding:6px;" th:text="${sub.semester}"></td>
        <td style= "border:1px solid #ccc; padding:6px;" th:text="${sub.subjectCode}"></td>
        <td style= "border:1px solid #ccc; padding:6px;" th:text="${sub.mark}"></td>
        </tr>
        </tbody>
        </table>  
        <a th:href="@{/studentlogin}">🔒 Logout</a>
    </div>
</body>
</html>
